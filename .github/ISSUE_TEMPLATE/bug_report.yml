name: Bug report
description: Something in MPDJ doesn't work as it should, and you can make it happen again
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. MPDJ is a one-person hobby project, so a fix may take a while.
        Questions and ideas go to [Discussions](https://github.com/longcutter/mpdj/discussions) instead.

  - type: input
    id: version
    attributes:
      label: MPDJ version
      description: The commit or branch you built, or the sha256 of the binary (`shasum -a 256 tracker-mpc` on a Mac, `sha256sum tracker-mpc` on Linux).
      placeholder: "mpc-port 3a62bf1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: MPC model and firmware
      placeholder: "MPC One+, firmware 2.14"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: Start from a known state (for example "new project, MPDJ Kit loaded into slots 1-16").
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The terminal output if you ran MPDJ over SSH, or `journalctl -u mpdj -b` if it started at power-on. After a crash, the lines starting with `MPDJ CRASH` matter most.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Photos of the screen, the project or sample that triggers it, how often it happens.
